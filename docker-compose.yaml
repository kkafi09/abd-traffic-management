services:
  kafka:
    image: apache/kafka:3.7.0
    container_name: kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    volumes:
      - kafka_kraft_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 15s

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: kafka-ui
    ports:
      - "8085:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: surabaya-traffic-cluster
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
      DYNAMIC_CONFIG_ENABLED: "true"
    depends_on:
      kafka:
        condition: service_healthy

  target-postgres:
    image: postgres:15-alpine
    container_name: stream-postgres
    environment:
      POSTGRES_USER: de_user
      POSTGRES_PASSWORD: password123
      POSTGRES_DB: traffic_warehouse
    ports:
      - "5434:5432"
    volumes:
      - ./sql/init_stream.sql:/docker-entrypoint-initdb.d/init_stream.sql
      - postgres_stream_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "de_user", "-d", "traffic_warehouse"]
      interval: 5s
      timeout: 5s
      retries: 5

  traffic-producer:
    build:
      context: ./producer
      dockerfile: Dockerfile
    container_name: traffic-producer
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      KAFKA_TOPIC: traffic-events
      DATA_FILE_PATH: /app/data/traffic_conditions_surabaya.csv
      STREAM_DELAY_SECONDS: "0.2"
      BATCH_EMIT_SIZE: "5"
      LOOP_STREAM: "true"
    volumes:
      - ./data:/app/data:ro
    restart: unless-stopped
    depends_on:
      kafka:
        condition: service_healthy

  stream-consumer:
    build:
      context: ./consumer
      dockerfile: Dockerfile
    container_name: stream-consumer
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      KAFKA_TOPIC: traffic-events
      KAFKA_GROUP_ID: surabaya-stream-etl-group
      POSTGRES_HOST: target-postgres
      POSTGRES_PORT: "5432"
      POSTGRES_DB: traffic_warehouse
      POSTGRES_USER: de_user
      POSTGRES_PASSWORD: password123
      ROADS_DATA_PATH: /app/data/road_segments_surabaya.csv
      BATCH_FLUSH_SIZE: "20"
      FLUSH_INTERVAL_SEC: "1.0"
    volumes:
      - ./data:/app/data:ro
    restart: unless-stopped
    depends_on:
      kafka:
        condition: service_healthy
      target-postgres:
        condition: service_healthy

volumes:
  kafka_kraft_data:
  postgres_stream_data:
